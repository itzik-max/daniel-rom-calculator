<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- קריאייטיבים למודעות. כל מודעה נבחרת לפי הכתובת: creative.html#<קונספט>-<פורמט>, למשל #leads-feed -->
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a14; --panel: #0e1a2f; --panel-2: #13223b; --text: #f4f1ea; --muted: #a3acbd;
    --gold: #d6b25e; --gold-hi: #f1d488; --gold-lo: #a97c2c; --red: #e2735f; --amber: #e6b04b;
    --serif: "Frank Ruhl Libre", serif; --sans: "Heebo", sans-serif;
    --gold-grad: linear-gradient(135deg, var(--gold-hi), var(--gold) 45%, var(--gold-lo));
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: #222; font-family: var(--sans); color: var(--text); }
  .ad { position: relative; overflow: hidden; background: var(--bg); display: none; flex-direction: column; }
  .ad.on { display: flex; }
  .feed { width: 1080px; height: 1350px; padding: 80px 84px 70px; }
  .story { width: 1080px; height: 1920px; padding: 230px 84px 300px; } /* שוליים לממשק של סטוריז */
  .ad::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(60% 40% at 90% -5%, rgba(214,178,94,.22), transparent 70%),
                radial-gradient(70% 45% at 0% 105%, rgba(40,70,130,.35), transparent 70%); }
  .ad > * { position: relative; }
  .gold { background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brand { display: flex; align-items: center; justify-content: center; margin-top: auto; padding-top: 28px; }
  .brand img { width: 250px; mix-blend-mode: lighten; }
  .story .brand img { width: 300px; }
  .eyebrow { color: var(--gold); font-weight: 800; font-size: 34px; letter-spacing: .02em; }
  h1 { font-family: var(--serif); font-weight: 900; line-height: 1.12; }
  .cta { align-self: center; margin-top: 44px; padding: 26px 60px; border-radius: 22px; background: var(--gold-grad);
         color: #1a1205; font-weight: 900; font-size: 42px; box-shadow: 0 20px 50px -18px rgba(214,178,94,.6); }
  .sub { font-size: 38px; color: #d7dbe3; line-height: 1.45; }

  /* ── קונספט 1: 100 פניות ── */
  .leads h1 { font-size: 96px; margin: 20px 0 0; }
  .leads .dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 12px; width: 560px; margin: 40px auto 0; direction: ltr; }
  .feed.leads .dots { width: 470px; gap: 10px; margin-top: 30px; }
  .feed.leads .legend { margin-top: 22px; }
  .feed .brand img { width: 210px; }
  .story.leads .dots { width: 700px; gap: 14px; margin-top: 56px; }
  .leads .dots i { aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.08); }
  .leads .dots i.won { background: var(--gold-grad); border: 0; box-shadow: 0 0 22px rgba(214,178,94,.45); }
  .leads .legend { display: flex; justify-content: center; gap: 46px; margin-top: 30px; font-size: 32px; color: var(--muted); }
  .leads .legend b { color: var(--text); }
  .leads .legend span::before { content: ""; display: inline-block; width: 22px; height: 22px; border-radius: 50%; margin-inline-end: 10px; vertical-align: -2px; background: rgba(255,255,255,.18); }
  .leads .legend span:first-child::before { background: var(--gold); }
  .leads .q { font-family: var(--serif); font-weight: 900; font-size: 64px; text-align: center; margin-top: 34px; line-height: 1.2; }
  .story.leads .q { font-size: 76px; margin-top: 60px; }
  .feed .cta { margin-top: 30px; }

  /* ── קונספט 2: התוצאה בטלפון ── */
  .phone-ad h1 { font-size: 92px; text-align: center; }
  .phone-ad .eyebrow { text-align: center; }
  .phone { width: 600px; margin: 50px auto 0; border-radius: 64px; padding: 22px; background: linear-gradient(160deg, #2a3550, #0b1222);
           box-shadow: 0 50px 90px -30px rgba(0,0,0,.8), 0 0 0 2px rgba(214,178,94,.25); }
  .screen { border-radius: 46px; background: var(--bg); padding: 46px 30px 34px; overflow: hidden; }
  .card { text-align: center; padding: 30px 18px; border-radius: 30px; background: radial-gradient(120% 90% at 50% 0%, #1b2b48, var(--panel) 70%); border: 1px solid rgba(214,178,94,.25); }
  .card .k { color: var(--gold); font-weight: 800; font-size: 22px; }
  .card .t { font-family: var(--serif); font-weight: 700; font-size: 30px; margin-top: 6px; }
  .card .amt { font-family: var(--serif); font-weight: 900; font-size: 92px; line-height: 1.1; margin-top: 8px; direction: ltr; }
  .card .y { display: inline-block; margin-top: 10px; padding: 6px 18px; border-radius: 99px; background: rgba(214,178,94,.12); border: 1px solid rgba(214,178,94,.25); font-weight: 700; font-size: 22px; }
  .leak { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 18px 20px; border-radius: 22px; background: var(--panel); border: 1px solid rgba(255,255,255,.08); font-size: 25px; font-weight: 700; }
  .leak i { width: 16px; height: 16px; border-radius: 50%; flex: none; background: var(--amber); }
  .leak i.r { background: var(--red); }
  .leak span:last-child { margin-inline-start: auto; font-family: var(--serif); font-weight: 900; direction: ltr; }
  .note { text-align: center; color: var(--muted); font-size: 26px; margin-top: 22px; }
  .story .phone { width: 700px; margin-top: 70px; }
  .story.phone-ad h1 { font-size: 104px; }

  /* ── קונספט 3: הדליפות ── */
  .leaks h1 { font-size: 84px; margin-top: 18px; }
  .leaks ul { list-style: none; padding: 0; margin-top: 38px; display: grid; gap: 16px; }
  .story.leaks ul { margin-top: 60px; gap: 24px; }
  .leaks li { display: flex; align-items: center; gap: 26px; padding: 22px 30px; border-radius: 26px; font-size: 40px; font-weight: 700;
              background: linear-gradient(180deg, var(--panel-2), var(--panel)); border: 1px solid rgba(255,255,255,.08); }
  .leaks li b { font-family: var(--serif); font-size: 46px; width: 64px; height: 64px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--gold-grad); color: #1a1205; }
  .leaks .q { font-size: 40px; margin-top: 30px; color: #d7dbe3; text-align: center; }
  .story.leaks h1 { font-size: 104px; }
  .story.leaks li { font-size: 48px; padding: 34px 34px; }
</style>
</head>
<body>

<!-- 1. 100 פניות, 20 לקוחות -->
<section class="ad feed leads" id="leads-feed"></section>
<section class="ad story leads" id="leads-story"></section>
<template id="t-leads">
  <div class="eyebrow">בעלי עסקים, שאלה אחת:</div>
  <h1>100 פניות.<br><span class="gold">20 לקוחות.</span></h1>
  <div class="dots"></div>
  <div class="legend"><span><b>20</b> קנו</span><span><b>80</b> הלכו למקום אחר</span></div>
  <div class="q">כמה הן היו שוות לכם?</div>
  <div class="cta">לחשב בשתי דקות ←</div>
  <div class="brand"><img src="../docs/assets/logo.jpg" alt=""></div>
</template>

<!-- 2. התוצאה בטלפון -->
<section class="ad feed phone-ad" id="phone-feed"></section>
<section class="ad story phone-ad" id="phone-story"></section>
<template id="t-phone">
  <div class="eyebrow">מחשבון חינמי לבעלי עסקים</div>
  <h1>כמה כסף נשאר לכם<br><span class="gold">על הרצפה</span> כל חודש?</h1>
  <div class="phone"><div class="screen">
    <div class="card">
      <div class="k">השיקוף שלכם</div>
      <div class="t">כל חודש נשארים על הרצפה</div>
      <div class="amt gold">₪44,000</div>
      <div class="y">זה ₪527,000 בשנה</div>
    </div>
    <div class="leak"><i class="r"></i><span>פונים שלא מגיעים לשיחה</span><span>₪13,000</span></div>
    <div class="leak"><i></i><span>פולואפ למי שלא סגר</span><span>₪7,100</span></div>
    <div class="leak"><i></i><span>זמן התגובה לפנייה</span><span>₪5,800</span></div>
  </div></div>
  <div class="note">* דוגמה להמחשה. התוצאה שלכם לפי המספרים שלכם</div>
  <div class="brand"><img src="../docs/assets/logo.jpg" alt=""></div>
</template>

<!-- 3. איפה הכסף בורח -->
<section class="ad feed leaks" id="leaks-feed"></section>
<section class="ad story leaks" id="leaks-story"></section>
<template id="t-leaks">
  <div class="eyebrow">פניות נכנסות, אבל לא נסגרות?</div>
  <h1>4 מקומות שבהם<br><span class="gold">כסף בורח מהעסק</span></h1>
  <ul>
    <li><b>1</b>חוזרים לפנייה רק למחרת</li>
    <li><b>2</b>"אני אחשוב על זה" ונעלם</li>
    <li><b>3</b>הנחה כדי לסגור</li>
    <li><b>4</b>הלקוח קנה, ולא הצענו עוד</li>
  </ul>
  <div class="q">בדקו כמה זה עולה לכם בחודש</div>
  <div class="cta">למחשבון ←</div>
  <div class="brand"><img src="../docs/assets/logo.jpg" alt=""></div>
</template>

<script>
  for (const ad of document.querySelectorAll(".ad")) {
    ad.append(document.getElementById("t-" + ad.id.split("-")[0]).content.cloneNode(true));
  }
  const dots = (n) => Array.from({ length: n }, (_, i) => `<i class="${[3, 8, 11, 17, 24, 30, 36, 42, 45, 51, 57, 63, 66, 72, 78, 81, 86, 90, 94, 98].includes(i) ? "won" : ""}"></i>`).join("");
  document.querySelectorAll(".dots").forEach((d) => (d.innerHTML = dots(100)));
  const show = () => {
    document.querySelectorAll(".ad").forEach((a) => a.classList.toggle("on", "#" + a.id === location.hash || !location.hash));
  };
  addEventListener("hashchange", show);
  show();
</script>
</body>
</html>
